<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Dark Slate App Icon Base -->
  <rect width="512" height="512" rx="112" ry="112" fill="#18191C" />

  <!-- Ultra-Simple Flat Silhouette (Unisex Warm Coral/Terracotta) -->
  <g transform="translate(0, 8)">
    <!-- Main Body Shell: Single continuous flat shape -->
    <path d="M 144 352 
             V 210 
             C 144 140, 368 140, 368 210 
             V 352 
             C 368 375, 345 392, 322 392 
             C 300 392, 288 375, 288 352 
             V 336 
             H 224 
             V 352 
             C 224 375, 212 392, 190 392 
             C 167 392, 144 375, 144 352 Z" 
          fill="#FF7A59" />

    <!-- Soft Curved Side Handles/Ears (Integral to Body) -->
    <path d="M 120 230 C 100 230, 100 290, 120 290 Z" fill="#FF7A59" />
    <path d="M 392 230 C 412 230, 412 290, 392 290 Z" fill="#FF7A59" />

    <!-- Minimal Eye Cutouts (Clean Negative Space) -->
    <circle cx="216" cy="236" r="22" fill="#18191C" />
    <circle cx="296" cy="236" r="22" fill="#18191C" />

    <!-- Friendly Smile Line -->
    <path d="M 232 272 Q 256 288 280 272" 
          fill="none" 
          stroke="#18191C" 
          stroke-width="10" 
          stroke-linecap="round" />
  </g>
</svg>
