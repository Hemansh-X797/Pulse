<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-0: #0b0d12;
    --bg-1: #12151c;
    --bg-2: #191d27;
    --bg-3: #222735;
    --line: #262c3a;
    --text-hi: #f2f3f7;
    --text-mid: #9aa1b4;
    --text-lo: #5c6379;
    --accent-top: #6C8CFF;
    --accent-bottom: #FF6FA5;
    --grad: linear-gradient(155deg, var(--accent-top), var(--accent-bottom));
    --radius: 14px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg-0);
    color: var(--text-hi);
    font-family: var(--font-body);
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }

  /* ---------- Auth screen ---------- */
  .auth-screen {
    width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 15% 20%, rgba(108,140,255,0.18), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(255,111,165,0.16), transparent 45%),
      var(--bg-0);
  }
  .auth-card {
    width: 380px; padding: 40px 36px; background: var(--bg-1); border: 1px solid var(--line);
    border-radius: 20px; box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }
  .auth-logo {
    font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -0.02em;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 4px;
  }
  .auth-sub { color: var(--text-mid); font-size: 13.5px; margin-bottom: 28px; }
  .field { margin-bottom: 14px; }
  .field label { display:block; font-size: 12px; color: var(--text-mid); margin-bottom: 6px; font-weight: 500; }
  .field input {
    width: 100%; padding: 11px 13px; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 10px; color: var(--text-hi); font-size: 14px; font-family: var(--font-body);
    outline: none; transition: border-color .15s;
  }
  .field input:focus { border-color: var(--accent-top); }
  .btn-primary {
    width: 100%; padding: 12px; margin-top: 6px; border: none; border-radius: 10px;
    background: var(--grad); color: #0b0d12; font-weight: 600; font-size: 14px; cursor: pointer;
    font-family: var(--font-body); transition: filter .15s, transform .1s;
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-primary:active { transform: scale(0.98); }
  .auth-toggle { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-mid); }
  .auth-toggle a { color: var(--accent-top); cursor: pointer; text-decoration: none; font-weight: 500; }
  .auth-error { color: #ff7b7b; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
  .oauth-row { display: flex; gap: 8px; margin-bottom: 18px; }
  .oauth-btn {
    flex: 1; padding: 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2);
    color: var(--text-mid); font-size: 12px; text-align: center; cursor: not-allowed; opacity: 0.55;
  }
  .divider { display:flex; align-items:center; gap:10px; color: var(--text-lo); font-size:11px; margin: 4px 0 18px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background: var(--line); }

  /* ---------- Sidebar ---------- */
  .sidebar { width: 240px; background: var(--bg-1); border-right: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-logo { padding: 20px 18px 14px; font-family: var(--font-display); font-weight: 700; font-size: 20px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav-section { padding: 6px 10px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--text-lo); padding: 10px 10px 6px; font-weight: 600; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer;
    color: var(--text-mid); font-size: 13.5px; font-weight: 500; margin-bottom: 2px; transition: background .12s, color .12s;
  }
  .nav-item:hover { background: var(--bg-2); color: var(--text-hi); }
  .nav-item.active { background: var(--bg-3); color: var(--text-hi); }
  .nav-item .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grad); flex-shrink:0; }
  .sidebar-footer { margin-top: auto; padding: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; display:flex; align-items:center; justify-content:center;
    font-weight: 700; font-size: 13px; color: #0b0d12; font-family: var(--font-display);
  }
  .sidebar-footer .who { font-size: 13px; font-weight: 600; }
  .sidebar-footer .status { font-size: 11px; color: var(--text-lo); }

  /* ---------- Main panel ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-0); }
  .topbar { height: 56px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; gap: 10px; flex-shrink:0; }
  .topbar h2 { font-family: var(--font-display); font-size: 15.5px; font-weight: 600; margin: 0; }
  .topbar .sub { color: var(--text-lo); font-size: 12px; }

  /* Chat */
  .chat-scroll { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 2px; }
  .msg-row { display: flex; gap: 10px; padding: 6px 0; max-width: 720px; }
  .msg-row .mini-avatar {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
    display:flex; align-items:center; justify-content:center; font-size: 11px; font-weight: 700;
    color: #0b0d12; font-family: var(--font-display);
  }
  .msg-body { display: flex; flex-direction: column; }
  .msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .msg-meta .name { font-size: 13px; font-weight: 600; }
  .msg-meta .time { font-size: 10.5px; color: var(--text-lo); }
  .bubble {
    background: var(--bg-2); border: 1px solid var(--line); padding: 9px 13px; border-radius: 16px 16px 16px 4px;
    font-size: 14px; line-height: 1.5; color: var(--text-hi); max-width: fit-content; word-break: break-word;
  }
  .bubble.mine {
    background: var(--grad); color: #0b0d12; border: none; font-weight: 500;
    border-radius: 16px 16px 4px 16px;
  }
  .msg-row.mine { flex-direction: row-reverse; }
  .msg-row.mine .msg-body { align-items: flex-end; }
  .msg-row.mine .msg-meta { flex-direction: row-reverse; }

  .composer { padding: 16px 24px 22px; flex-shrink: 0; }
  .composer-inner {
    display: flex; align-items: center; gap: 10px; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 14px; padding: 8px 8px 8px 16px;
  }
  .composer-inner input {
    flex: 1; background: transparent; border: none; outline: none; color: var(--text-hi); font-size: 14px; font-family: var(--font-body);
  }
  .composer-inner input::placeholder { color: var(--text-lo); }
  .send-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--grad); color: #0b0d12;
    font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .hint { font-size: 11px; color: var(--text-lo); margin-top: 8px; padding-left: 4px; }
  .hint code { background: var(--bg-2); padding: 1px 5px; border-radius: 4px; color: var(--text-mid); }

  /* Feed */
  .feed-scroll { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .composer-post {
    width: 100%; max-width: 560px; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
  }
  .composer-post textarea {
    width: 100%; background: transparent; border: none; outline: none; color: var(--text-hi); font-size: 14px;
    font-family: var(--font-body); resize: none; min-height: 44px;
  }
  .composer-post .row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .composer-post button {
    padding: 7px 16px; border-radius: 8px; border: none; background: var(--grad); color: #0b0d12; font-weight: 600;
    font-size: 12.5px; cursor: pointer;
  }
  .post-card { width: 100%; max-width: 560px; background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
  .post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-head .name { font-size: 13.5px; font-weight: 600; }
  .post-head .username { font-size: 12px; color: var(--text-lo); }
  .post-body { font-size: 14.5px; line-height: 1.6; color: var(--text-hi); margin-bottom: 12px; white-space: pre-wrap; }
  .post-actions { display: flex; gap: 6px; align-items: center; }
  .react-btn {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px; font-size: 12.5px;
    color: var(--text-mid); cursor: pointer; display: flex; gap: 4px; align-items: center; transition: background .12s;
  }
  .react-btn:hover { background: var(--bg-3); color: var(--text-hi); }
  .comment-toggle { font-size: 12px; color: var(--text-lo); cursor: pointer; margin-left: auto; }
  .comments-box { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: none; }
  .comments-box.open { display: block; }
  .comment-row { font-size: 13px; margin-bottom: 6px; color: var(--text-mid); }
  .comment-row b { color: var(--text-hi); font-weight: 600; }
  .comment-input-row { display: flex; gap: 8px; margin-top: 8px; }
  .comment-input-row input {
    flex: 1; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
    color: var(--text-hi); font-size: 12.5px; outline: none; font-family: var(--font-body);
  }
  .comment-input-row button { padding: 6px 12px; border-radius: 8px; border: none; background: var(--bg-3); color: var(--text-hi); font-size: 12px; cursor: pointer; }

  /* Profile editor */
  .profile-scroll { flex: 1; overflow-y: auto; padding: 24px; display: flex; justify-content: center; }
  .profile-card { width: 100%; max-width: 560px; }
  .banner-preview {
    height: 120px; border-radius: var(--radius) var(--radius) 0 0; background: var(--grad); position: relative;
  }
  .profile-avatar-lg {
    width: 76px; height: 76px; border-radius: 50%; border: 4px solid var(--bg-0); position: absolute; bottom: -38px; left: 24px;
    display:flex; align-items:center; justify-content:center; font-size: 26px; font-weight: 700; color: #0b0d12; font-family: var(--font-display);
  }
  .profile-body { background: var(--bg-1); border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius) var(--radius); padding: 50px 24px 24px; }
  .grad-controls { display: flex; gap: 14px; margin-top: 18px; }
  .grad-controls .field { flex: 1; }
  .field input[type=color] { height: 40px; padding: 3px; cursor: pointer; }
  textarea.bio-input {
    width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    color: var(--text-hi); font-size: 13.5px; font-family: var(--font-body); resize: vertical; min-height: 60px; outline: none;
  }
  .save-row { display: flex; justify-content: flex-end; margin-top: 18px; align-items: center; }
  .saved-tag { color: #7CE3A0; font-size: 12px; margin-right: auto; opacity: 0; transition: opacity .3s; }
  .saved-tag.show { opacity: 1; }
  .empty-state { color: var(--text-lo); font-size: 13px; text-align: center; margin-top: 60px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const API = 'http://localhost:8080';
const WS = 'ws://localhost:8081';
const EMOJI_HINT = ':fire: :heart: :rocket: :100: :joy: :thumbsup: :eyes: :clap: :tada: :skull:';

let state = {
  screen: 'login',      // login | signup | app
  token: localStorage.getItem('pulse_token') || null,
  me: null,
  tab: 'feed',           // feed | dm | profile
  dmChannelId: 1,
  messages: [],
  posts: [],
  authError: '',
  savedFlash: false,
};

let ws = null;

function initials(name) {
  return (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
}
function avatarStyle(u) {
  const top = u?.accent_color_top || '#6C8CFF', bot = u?.accent_color_bottom || '#FF6FA5';
  return `background: linear-gradient(155deg, ${top}, ${bot});`;
}
function timeAgo(ts) {
  const d = Math.floor(Date.now()/1000) - ts;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d/60) + 'm ago';
  if (d < 86400) return Math.floor(d/3600) + 'h ago';
  return Math.floor(d/86400) + 'd ago';
}
function esc(s) {
  const div = document.createElement('div'); div.textContent = s ?? ''; return div.innerHTML;
}

async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(json.error || 'request failed');
  return json;
}

async function doSignup(username, password, displayName) {
  await api('/signup', { method: 'POST', body: JSON.stringify({ username, password, display_name: displayName }) });
  await doLogin(username, password);
}
async function doLogin(username, password) {
  const r = await api('/login', { method: 'POST', body: JSON.stringify({ username, password }) });
  state.token = r.token;
  localStorage.setItem('pulse_token', r.token);
  await afterAuth();
}
async function afterAuth() {
  state.me = await api('/me');
  state.screen = 'app';
  connectWs();
  await loadFeed();
  render();
}
function logout() {
  localStorage.removeItem('pulse_token');
  state = { ...state, token: null, me: null, screen: 'login' };
  if (ws) ws.close();
  render();
}

function connectWs() {
  ws = new WebSocket(WS);
  ws.onopen = () => {
    ws.send(JSON.stringify({ op: 'auth', token: state.token }));
  };
  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.op === 'auth_ok') {
      ws.send(JSON.stringify({ op: 'join', channel_id: state.dmChannelId }));
      ws.send(JSON.stringify({ op: 'history', channel_id: state.dmChannelId, limit: 50 }));
    } else if (msg.op === 'history') {
      state.messages = msg.messages.slice().reverse();
      render();
    } else if (msg.op === 'message') {
      if (msg.channel_id === state.dmChannelId) {
        state.messages.push(msg);
        render();
      }
    }
  };
  ws.onclose = () => { setTimeout(() => { if (state.screen === 'app') connectWs(); }, 1500); };
}

async function loadFeed() {
  const r = await api('/feed');
  state.posts = r.posts;
}

function sendChatMessage(text) {
  if (!text.trim() || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ op: 'send', channel_id: state.dmChannelId, body: text }));
}

async function createPost(text) {
  if (!text.trim()) return;
  await api('/posts', { method: 'POST', body: JSON.stringify({ body: text }) });
  await loadFeed();
  render();
}
async function reactToPost(postId, shortcode) {
  await api(`/posts/${postId}/react`, { method: 'POST', body: JSON.stringify({ shortcode }) });
  await loadFeed();
  render();
}
let openComments = {};
let commentsCache = {};
async function toggleComments(postId) {
  openComments[postId] = !openComments[postId];
  if (openComments[postId] && !commentsCache[postId]) {
    const r = await api(`/posts/${postId}/comments`);
    commentsCache[postId] = r.comments;
  }
  render();
}
async function submitComment(postId, text) {
  if (!text.trim()) return;
  await api(`/posts/${postId}/comments`, { method: 'POST', body: JSON.stringify({ body: text }) });
  const r = await api(`/posts/${postId}/comments`);
  commentsCache[postId] = r.comments;
  await loadFeed();
  render();
}
async function saveProfile(fields) {
  state.me = await api('/me', { method: 'PATCH', body: JSON.stringify(fields) });
  state.savedFlash = true;
  render();
  setTimeout(() => { state.savedFlash = false; render(); }, 1600);
}

// ---------------- Rendering ----------------
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'login' || state.screen === 'signup') {
    app.innerHTML = renderAuth();
    wireAuth();
    return;
  }
  app.innerHTML = renderApp();
  wireApp();
}

function renderAuth() {
  const isSignup = state.screen === 'signup';
  return `
  <div class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">Pulse</div>
      <div class="auth-sub">${isSignup ? 'Create your account' : 'Welcome back'}</div>

      <div class="oauth-row">
        <div class="oauth-btn" title="Coming in Phase 3">Continue with Google</div>
        <div class="oauth-btn" title="Coming in Phase 3">Continue with Discord</div>
      </div>
      <div class="divider">or use a username</div>

      ${isSignup ? `
      <div class="field"><label>Display name</label><input id="f-display" placeholder="Alice"/></div>
      ` : ''}
      <div class="field"><label>Username</label><input id="f-username" placeholder="alice"/></div>
      <div class="field"><label>Password</label><input id="f-password" type="password" placeholder="••••••••"/></div>

      <button class="btn-primary" id="f-submit">${isSignup ? 'Create account' : 'Log in'}</button>
      <div class="auth-error">${state.authError || ''}</div>
      <div class="auth-toggle">
        ${isSignup ? `Already have an account? <a id="f-toggle">Log in</a>` : `New here? <a id="f-toggle">Create an account</a>`}
      </div>
    </div>
  </div>`;
}

function wireAuth() {
  document.getElementById('f-toggle').onclick = () => {
    state.screen = state.screen === 'signup' ? 'login' : 'signup';
    state.authError = '';
    render();
  };
  document.getElementById('f-submit').onclick = async () => {
    const username = document.getElementById('f-username').value.trim();
    const password = document.getElementById('f-password').value;
    try {
      if (state.screen === 'signup') {
        const displayName = document.getElementById('f-display').value.trim();
        await doSignup(username, password, displayName);
      } else {
        await doLogin(username, password);
      }
    } catch (e) {
      state.authError = e.message;
      render();
    }
  };
}

function renderApp() {
  const me = state.me;
  return `
  <div class="sidebar">
    <div class="sidebar-logo">Pulse</div>
    <div class="nav-section">
      <div class="nav-label">Home</div>
      <div class="nav-item ${state.tab==='feed'?'active':''}" data-tab="feed"><span class="dot"></span> Feed</div>
      <div class="nav-item ${state.tab==='dm'?'active':''}" data-tab="dm"><span class="dot"></span> Direct Messages</div>
      <div class="nav-item ${state.tab==='profile'?'active':''}" data-tab="profile"><span class="dot"></span> Edit Profile</div>
    </div>
    <div class="sidebar-footer" id="footer-logout">
      <div class="avatar" style="${avatarStyle(me)}">${initials(me.display_name)}</div>
      <div>
        <div class="who">${esc(me.display_name)}</div>
        <div class="status">${esc(me.status_text) || 'log out'}</div>
      </div>
    </div>
  </div>
  <div class="main">
    ${state.tab === 'feed' ? renderFeed() : state.tab === 'dm' ? renderDm() : renderProfile()}
  </div>`;
}

function renderFeed() {
  return `
  <div class="topbar"><h2>Feed</h2><span class="sub">&nbsp;— posts from everyone on Pulse</span></div>
  <div class="feed-scroll">
    <div class="composer-post">
      <textarea id="post-input" placeholder="What's happening? Try :fire: :rocket: :100:"></textarea>
      <div class="row"><button id="post-submit">Post</button></div>
    </div>
    ${state.posts.length === 0 ? `<div class="empty-state">No posts yet — be the first.</div>` : ''}
    ${state.posts.map(renderPostCard).join('')}
  </div>`;
}

function renderPostCard(p) {
  const open = !!openComments[p.id];
  const comments = commentsCache[p.id] || [];
  return `
  <div class="post-card">
    <div class="post-head">
      <div class="avatar" style="width:34px;height:34px;font-size:12px;${avatarStyle({accent_color_top:'#6C8CFF',accent_color_bottom:'#FF6FA5'})}">${initials(p.author_display_name)}</div>
      <div><div class="name">${esc(p.author_display_name)}</div><div class="username">@${esc(p.author_username)} · ${timeAgo(p.created_at)}</div></div>
    </div>
    <div class="post-body">${p.body}</div>
    <div class="post-actions">
      <div class="react-btn" data-react="${p.id}" data-shortcode="fire">🔥 React</div>
      <div class="react-btn" data-react="${p.id}" data-shortcode="heart">❤️</div>
      <div class="react-btn" data-react="${p.id}" data-shortcode="100">💯</div>
      <div class="comment-toggle" data-comments="${p.id}">${p.comment_count} comment${p.comment_count===1?'':'s'}</div>
    </div>
    <div class="comments-box ${open?'open':''}">
      ${comments.map(c => `<div class="comment-row"><b>${esc(c.author)}</b> ${c.body}</div>`).join('') || '<div class="comment-row">No comments yet.</div>'}
      <div class="comment-input-row">
        <input placeholder="Write a comment..." data-comment-input="${p.id}"/>
        <button data-comment-submit="${p.id}">Send</button>
      </div>
    </div>
  </div>`;
}

function renderDm() {
  return `
  <div class="topbar"><h2>Direct Messages</h2><span class="sub">&nbsp;— channel #${state.dmChannelId}</span></div>
  <div class="chat-scroll" id="chat-scroll">
    ${state.messages.map(m => {
      const mine = m.sender === state.me.username;
      return `
      <div class="msg-row ${mine?'mine':''}">
        <div class="mini-avatar" style="${avatarStyle({accent_color_top:'#6C8CFF',accent_color_bottom:'#FF6FA5'})}">${initials(m.sender)}</div>
        <div class="msg-body">
          <div class="msg-meta"><span class="name">${esc(m.sender)}</span><span class="time">${m.ts?timeAgo(m.ts):''}</span></div>
          <div class="bubble ${mine?'mine':''}">${m.body}</div>
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="composer">
    <div class="composer-inner">
      <input id="chat-input" placeholder="Message... try :fire: :heart: :rocket:"/>
      <button class="send-btn" id="chat-send">➤</button>
    </div>
    <div class="hint">Shortcodes render live: ${EMOJI_HINT.split(' ').map(s=>`<code>${s}</code>`).join(' ')}</div>
  </div>`;
}

function renderProfile() {
  const me = state.me;
  return `
  <div class="topbar"><h2>Edit Profile</h2><span class="sub">&nbsp;— Discord-style dual gradient</span></div>
  <div class="profile-scroll">
    <div class="profile-card">
      <div class="banner-preview" id="banner-preview">
        <div class="profile-avatar-lg" id="avatar-preview">${initials(me.display_name)}</div>
      </div>
      <div class="profile-body">
        <div class="field"><label>Display name</label><input id="p-display" value="${esc(me.display_name)}"/></div>
        <div class="field"><label>Pronouns</label><input id="p-pronouns" value="${esc(me.pronouns)}" placeholder="she/her"/></div>
        <div class="field"><label>Status</label><input id="p-status" value="${esc(me.status_text)}" placeholder="building Pulse :fire:"/></div>
        <div class="field"><label>Bio</label><textarea class="bio-input" id="p-bio" placeholder="Say something about yourself... :sparkles:">${esc(me.bio)}</textarea></div>
        <div class="grad-controls">
          <div class="field"><label>Accent — top</label><input type="color" id="p-top" value="${me.accent_color_top}"/></div>
          <div class="field"><label>Accent — bottom</label><input type="color" id="p-bottom" value="${me.accent_color_bottom}"/></div>
        </div>
        <div class="save-row">
          <span class="saved-tag ${state.savedFlash?'show':''}">Saved ✓</span>
          <button class="btn-primary" style="width:auto;padding:10px 20px;" id="p-save">Save profile</button>
        </div>
      </div>
    </div>
  </div>`;
}

function wireApp() {
  document.querySelectorAll('.nav-item[data-tab]').forEach(el => {
    el.onclick = () => { state.tab = el.dataset.tab; render(); };
  });
  document.getElementById('footer-logout').onclick = logout;

  if (state.tab === 'feed') {
    document.getElementById('post-submit').onclick = async () => {
      const el = document.getElementById('post-input');
      await createPost(el.value); el.value = '';
    };
    document.querySelectorAll('[data-react]').forEach(el => {
      el.onclick = () => reactToPost(el.dataset.react, el.dataset.shortcode);
    });
    document.querySelectorAll('[data-comments]').forEach(el => {
      el.onclick = () => toggleComments(el.dataset.comments);
    });
    document.querySelectorAll('[data-comment-submit]').forEach(el => {
      el.onclick = () => {
        const id = el.dataset.commentSubmit;
        const input = document.querySelector(`[data-comment-input="${id}"]`);
        submitComment(id, input.value); input.value = '';
      };
    });
  }

  if (state.tab === 'dm') {
    const scroll = document.getElementById('chat-scroll');
    if (scroll) scroll.scrollTop = scroll.scrollHeight;
    const input = document.getElementById('chat-input');
    const send = () => { sendChatMessage(input.value); input.value = ''; };
    document.getElementById('chat-send').onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter') send(); };
  }

  if (state.tab === 'profile') {
    const top = document.getElementById('p-top');
    const bottom = document.getElementById('p-bottom');
    const preview = document.getElementById('banner-preview');
    const updatePreview = () => {
      preview.style.background = `linear-gradient(155deg, ${top.value}, ${bottom.value})`;
      document.getElementById('avatar-preview').style.background = `linear-gradient(155deg, ${top.value}, ${bottom.value})`;
    };
    top.oninput = updatePreview; bottom.oninput = updatePreview;
    document.getElementById('p-save').onclick = () => saveProfile({
      display_name: document.getElementById('p-display').value,
      pronouns: document.getElementById('p-pronouns').value,
      status_text: document.getElementById('p-status').value,
      bio: document.getElementById('p-bio').value,
      accent_color_top: top.value,
      accent_color_bottom: bottom.value,
    });
  }
}

// boot
(async function boot() {
  if (state.token) {
    try { await afterAuth(); return; } catch (e) { localStorage.removeItem('pulse_token'); }
  }
  render();
})();
</script>
</body>
</html>
