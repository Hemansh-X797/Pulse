<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    "Verdant Ring" — the avatar-decoration half of a matching set with
    the Verdant Chrome nameplate (public/nameplates/verdantchrome.svg):
    same palette and material language (brushed silver plates, emerald
    circuit energy, black steel), just reworked into a ring instead of a
    flat plate, so equipping both together reads as one deliberate
    "look" rather than two unrelated pieces that happen to both be
    green. Built to the same 100x100 ring convention as psion.svg/
    duality.svg (avatar sits inside, decoration overhangs the edge
    slightly, CSS keyframe animation, no SMIL).
  -->
  <defs>
    <!-- Six silver hex-plate segments around the ring, each a slightly
         different gradient so they read as distinct armor plates
         bolted around the avatar rather than one continuous circle. -->
    <linearGradient id="vrPlate1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c4d0ca" />
      <stop offset="55%" stop-color="#6c7a72" />
      <stop offset="100%" stop-color="#1c211d" />
    </linearGradient>
    <linearGradient id="vrPlate2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aebcb4" />
      <stop offset="55%" stop-color="#59665f" />
      <stop offset="100%" stop-color="#141815" />
    </linearGradient>

    <radialGradient id="vrCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8dffc4" stop-opacity="1" />
      <stop offset="45%" stop-color="#2be89a" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0fe07a" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="vrArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0fe07a" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#5dffb8" stop-opacity="1" />
      <stop offset="100%" stop-color="#0fe07a" stop-opacity="0.1" />
    </linearGradient>

    <filter id="vrGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.2" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* The whole plated ring drifts in a slow rotation — six-fold
       symmetry means a 60deg turn is invisible as a "reset", so this
       reads as continuous motion rather than a loop you can catch. */
    .vr-ring { animation: vrSpin 24s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes vrSpin {
      to { transform: rotate(360deg); }
    }

    /* Emerald arcs pulse and travel opposite the plate rotation, so the
       two layers visibly counter-rotate against each other rather than
       moving as one flat unit. */
    .vr-arcs { animation: vrSpinReverse 9s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes vrSpinReverse {
      to { transform: rotate(-360deg); }
    }

    .vr-core { animation: vrPulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes vrPulse {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .vr-node { animation: vrBlink 1.8s ease-in-out infinite; }
    .vr-node.n2 { animation-delay: 0.3s; }
    .vr-node.n3 { animation-delay: 0.6s; }
    .vr-node.n4 { animation-delay: 0.9s; }
    .vr-node.n5 { animation-delay: 1.2s; }
    .vr-node.n6 { animation-delay: 1.5s; }
    @keyframes vrBlink {
      0%, 70%, 100% { opacity: 0.35; }
      85% { opacity: 1; }
    }

    /* Slowest of the three rotating layers — plates at 24s, arcs at 9s
       (reversed), this rail at 40s — so the whole piece never repeats
       the same relative alignment on any short, noticeable cycle. */
    .vr-rail { animation: vrSpin 40s linear infinite; transform-box: fill-box; transform-origin: center; }

    .vr-hexlines { animation: vrHexBreathe 5s ease-in-out infinite; }
    @keyframes vrHexBreathe {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Six hex-plates spaced 60deg apart around the ring at radius ~46,
       each a small rotated rounded rectangle standing in for an armor
       segment. Generated by hand at 6 explicit angles rather than a
       <use> loop, since decoration SVGs in this catalog are plain
       static markup with no script step to expand a loop at build
       time. -->
  <g class="vr-ring">
    <g transform="rotate(0 50 50)">
      <rect x="42" y="1" width="16" height="10" rx="2.5" fill="url(#vrPlate1)" transform="rotate(0 50 6)" />
    </g>
    <g transform="rotate(60 50 50)">
      <rect x="42" y="1" width="16" height="10" rx="2.5" fill="url(#vrPlate2)" transform="rotate(0 50 6)" />
    </g>
    <g transform="rotate(120 50 50)">
      <rect x="42" y="1" width="16" height="10" rx="2.5" fill="url(#vrPlate1)" transform="rotate(0 50 6)" />
    </g>
    <g transform="rotate(180 50 50)">
      <rect x="42" y="1" width="16" height="10" rx="2.5" fill="url(#vrPlate2)" transform="rotate(0 50 6)" />
    </g>
    <g transform="rotate(240 50 50)">
      <rect x="42" y="1" width="16" height="10" rx="2.5" fill="url(#vrPlate1)" transform="rotate(0 50 6)" />
    </g>
    <g transform="rotate(300 50 50)">
      <rect x="42" y="1" width="16" height="10" rx="2.5" fill="url(#vrPlate2)" transform="rotate(0 50 6)" />
    </g>

    <!-- Rivets on each plate -->
    <g fill="#e4ede8" fill-opacity="0.6">
      <circle cx="46" cy="6" r="0.9" transform="rotate(0 50 50)" />
      <circle cx="54" cy="6" r="0.9" transform="rotate(0 50 50)" />
      <circle cx="46" cy="6" r="0.9" transform="rotate(60 50 50)" />
      <circle cx="54" cy="6" r="0.9" transform="rotate(60 50 50)" />
      <circle cx="46" cy="6" r="0.9" transform="rotate(120 50 50)" />
      <circle cx="54" cy="6" r="0.9" transform="rotate(120 50 50)" />
      <circle cx="46" cy="6" r="0.9" transform="rotate(180 50 50)" />
      <circle cx="54" cy="6" r="0.9" transform="rotate(180 50 50)" />
      <circle cx="46" cy="6" r="0.9" transform="rotate(240 50 50)" />
      <circle cx="54" cy="6" r="0.9" transform="rotate(240 50 50)" />
      <circle cx="46" cy="6" r="0.9" transform="rotate(300 50 50)" />
      <circle cx="54" cy="6" r="0.9" transform="rotate(300 50 50)" />
    </g>
  </g>

  <!-- Emerald energy arcs — three short glowing arcs riding just inside
       the plate ring, counter-rotating against it. -->
  <g class="vr-arcs" filter="url(#vrGlow)">
    <path d="M 50 8 A 42 42 0 0 1 86 32" fill="none" stroke="url(#vrArc)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 88 55 A 42 42 0 0 1 62 91" fill="none" stroke="url(#vrArc)" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 30 90 A 42 42 0 0 1 8 60" fill="none" stroke="url(#vrArc)" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Six small junction nodes sitting between plates, blinking on
       independent staggered timers. -->
  <g filter="url(#vrGlow)">
    <circle class="vr-node n1" cx="50" cy="4" r="1.4" fill="#8dffc4" transform="rotate(30 50 50)" />
    <circle class="vr-node n2" cx="50" cy="4" r="1.4" fill="#8dffc4" transform="rotate(90 50 50)" />
    <circle class="vr-node n3" cx="50" cy="4" r="1.4" fill="#8dffc4" transform="rotate(150 50 50)" />
    <circle class="vr-node n4" cx="50" cy="4" r="1.4" fill="#8dffc4" transform="rotate(210 50 50)" />
    <circle class="vr-node n5" cx="50" cy="4" r="1.4" fill="#8dffc4" transform="rotate(270 50 50)" />
    <circle class="vr-node n6" cx="50" cy="4" r="1.4" fill="#8dffc4" transform="rotate(330 50 50)" />
  </g>

  <!-- A very faint core glow behind where the avatar itself sits —
       reads as the ring's energy leaking slightly inward, without ever
       obscuring the avatar image layered on top of this decoration. -->
  <circle class="vr-core" cx="50" cy="50" r="34" fill="url(#vrCore)" opacity="0.12" />

  <!-- Inner rail — a thin dashed silver circle riding just inside the
       plate ring, counter-rotating slower than the arcs above it so all
       three animated layers (plates, arcs, rail) drift at visibly
       different speeds instead of moving in lockstep. -->
  <circle
    class="vr-rail"
    cx="50" cy="50" r="38"
    fill="none"
    stroke="#c9d6cf"
    stroke-opacity="0.35"
    stroke-width="0.8"
    stroke-dasharray="1.5 4"
  />

  <!-- Hex connector lines between the six node positions — a faint
       structural hexagon implying the nodes are wired together, not
       just floating independently. Breathes opacity as one unit,
       slower than any of the node blink timers, so it reads as
       ambient structure rather than another blinking light. -->
  <g class="vr-hexlines" stroke="#3dffb0" stroke-opacity="0.25" stroke-width="0.6" fill="none">
    <line x1="50" y1="5.5" x2="84.5" y2="27.5" />
    <line x1="84.5" y1="27.5" x2="84.5" y2="72.5" />
    <line x1="84.5" y1="72.5" x2="50" y2="94.5" />
    <line x1="50" y1="94.5" x2="15.5" y2="72.5" />
    <line x1="15.5" y1="72.5" x2="15.5" y2="27.5" />
    <line x1="15.5" y1="27.5" x2="50" y2="5.5" />
  </g>

  <!-- Brushed texture on each plate — short near-radial hairlines, same
       "give the metal actual grain" reasoning as the fine-line texture
       on the Verdant Chrome nameplate this decoration is paired with,
       just wrapped around six small plates instead of three large ones. -->
  <g stroke="#e4ede8" stroke-opacity="0.18" stroke-width="0.4">
    <line x1="44" y1="2.5" x2="44" y2="9.5" transform="rotate(0 50 50)" />
    <line x1="47" y1="2" x2="47" y2="10" transform="rotate(0 50 50)" />
    <line x1="53" y1="2" x2="53" y2="10" transform="rotate(0 50 50)" />
    <line x1="56" y1="2.5" x2="56" y2="9.5" transform="rotate(0 50 50)" />
    <line x1="44" y1="2.5" x2="44" y2="9.5" transform="rotate(60 50 50)" />
    <line x1="47" y1="2" x2="47" y2="10" transform="rotate(60 50 50)" />
    <line x1="53" y1="2" x2="53" y2="10" transform="rotate(60 50 50)" />
    <line x1="56" y1="2.5" x2="56" y2="9.5" transform="rotate(60 50 50)" />
    <line x1="44" y1="2.5" x2="44" y2="9.5" transform="rotate(120 50 50)" />
    <line x1="47" y1="2" x2="47" y2="10" transform="rotate(120 50 50)" />
    <line x1="53" y1="2" x2="53" y2="10" transform="rotate(120 50 50)" />
    <line x1="56" y1="2.5" x2="56" y2="9.5" transform="rotate(120 50 50)" />
    <line x1="44" y1="2.5" x2="44" y2="9.5" transform="rotate(180 50 50)" />
    <line x1="47" y1="2" x2="47" y2="10" transform="rotate(180 50 50)" />
    <line x1="53" y1="2" x2="53" y2="10" transform="rotate(180 50 50)" />
    <line x1="56" y1="2.5" x2="56" y2="9.5" transform="rotate(180 50 50)" />
    <line x1="44" y1="2.5" x2="44" y2="9.5" transform="rotate(240 50 50)" />
    <line x1="47" y1="2" x2="47" y2="10" transform="rotate(240 50 50)" />
    <line x1="53" y1="2" x2="53" y2="10" transform="rotate(240 50 50)" />
    <line x1="56" y1="2.5" x2="56" y2="9.5" transform="rotate(240 50 50)" />
    <line x1="44" y1="2.5" x2="44" y2="9.5" transform="rotate(300 50 50)" />
    <line x1="47" y1="2" x2="47" y2="10" transform="rotate(300 50 50)" />
    <line x1="53" y1="2" x2="53" y2="10" transform="rotate(300 50 50)" />
    <line x1="56" y1="2.5" x2="56" y2="9.5" transform="rotate(300 50 50)" />
  </g>
</svg>
