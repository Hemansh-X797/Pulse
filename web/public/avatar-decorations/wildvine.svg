<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Deep Forest Atmosphere Glow -->
    <filter id="forestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Organic Leaf / Vine Gradients -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Glowing Magic Forest Trail -->
    <linearGradient id="natureVine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="1" />
      <stop offset="60%" stop-color="#22c55e" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#15803d" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="sporeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0" />
    </radialGradient>

    <!-- Reusable Pine / Evergreen Tree Crest Element -->
    <g id="pineTree">
      <polygon points="0,-6 -3,-1 -1,-1 -4,3 -1.5,3 -5,7 5,7 1.5,3 4,3 1,-1 3,-1" fill="url(#leafGrad)" stroke="#86efac" stroke-width="0.3" />
      <rect x="-0.8" y="7" width="1.6" height="2" fill="#78350f" />
    </g>

    <!-- Reusable Forest Leaf -->
    <g id="singleLeaf">
      <path d="M 0,-3 C 2,-2 3,0 0,3 C -3,0 -2,-2 0,-3 Z" fill="#4ade80" stroke="#16a34a" stroke-width="0.3" />
      <path d="M 0,-2.5 L 0,2.5" fill="none" stroke="#15803d" stroke-width="0.3" />
    </g>
  </defs>

  <style>
    /* Slow Organic Rotation for Canopy & Pines */
    .forest-spin {
      transform-origin: 50px 50px;
      animation: rotate-forest 12s linear infinite;
    }

    /* Counter-rotating Vines & Floating Leaves */
    .vine-spin {
      transform-origin: 50px 50px;
      animation: rotate-reverse 18s linear infinite;
    }

    /* Bioluminescent Forest Spores & Fireflies */
    .spore {
      animation: float-glow 2s ease-in-out infinite alternate;
    }
    .d1 { animation-delay: 0.4s; }
    .d2 { animation-delay: 0.9s; }
    .d3 { animation-delay: 1.4s; }

    @keyframes rotate-forest {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes float-glow {
      0% { opacity: 0.2; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <g filter="url(#forestGlow)">
    <!-- Natural Wood / Root Base Rim (Completely Clear Center for PFP) -->
    <circle cx="50" cy="50" r="43.5" fill="none" stroke="#15803d" stroke-width="0.8" stroke-dasharray="3 5" opacity="0.6" />

    <!-- ROTATING FOREST CANOPY (Pines at Opposite Crests) -->
    <g class="forest-spin">
      <!-- Top Forest Crest (Evergreen Tree) -->
      <use href="#pineTree" x="50" y="5" />
      
      <!-- Winding Vine Ring Arcs -->
      <path d="M 50,5 A 43.5 43.5 0 0 1 93.5,50" fill="none" stroke="url(#natureVine)" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 50,95 A 43.5 43.5 0 0 1 6.5,50" fill="none" stroke="url(#natureVine)" stroke-width="1.8" stroke-linecap="round" />

      <!-- Bottom Forest Crest (Inverted Evergreen Tree) -->
      <g transform="translate(50, 95) rotate(180)">
        <use href="#pineTree" x="0" y="0" />
      </g>
    </g>

    <!-- COUNTER-ROTATING LEAVES & VINE ACCENTS -->
    <g class="vine-spin">
      <!-- Leaf Clusters along perimeter -->
      <use href="#singleLeaf" transform="translate(92, 30) rotate(45)" />
      <use href="#singleLeaf" transform="translate(8, 70) rotate(-135)" />
      <use href="#singleLeaf" transform="translate(82, 80) rotate(120)" />
      <use href="#singleLeaf" transform="translate(18, 20) rotate(-60)" />

      <!-- Wooden Root / Vine Twigs -->
      <path d="M 91,48 Q 95,50 93,54" fill="none" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
      <path d="M 9,52 Q 5,50 7,46" fill="none" stroke="#78350f" stroke-width="1" stroke-linecap="round" />
    </g>

    <!-- FLOATING BIOLUMINESCENT FOREST SPORES / FIREFLIES -->
    <g class="vine-spin">
      <!-- Glowing Magic Spores -->
      <circle cx="88" cy="18" r="1.5" fill="#fef08a" class="spore" />
      <circle cx="12" cy="82" r="1.5" fill="#fef08a" class="spore d2" />
      <circle cx="85" cy="82" r="1.2" fill="#86efac" class="spore d1" />
      <circle cx="15" cy="18" r="1.2" fill="#86efac" class="spore d3" />

      <!-- Firefly Energy Sparks -->
      <g class="spore d1" transform="translate(94, 50)">
        <polygon points="0,-2 0.5,-0.5 2,0 0.5,0.5 0,2 -0.5,0.5 -2,0 -0.5,-0.5" fill="#fef08a" />
      </g>
      <g class="spore d3" transform="translate(6, 50)">
        <polygon points="0,-2 0.5,-0.5 2,0 0.5,0.5 0,2 -0.5,0.5 -2,0 -0.5,-0.5" fill="#fef08a" />
      </g>
    </g>
  </g>
</svg>
