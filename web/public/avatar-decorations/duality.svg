<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Dark Glowing Filters -->
    <filter id="psiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Color Gradients -->
    <linearGradient id="psiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="splitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <style>
    /* Continuous Smooth Rotations */
    .spin-slow {
      transform-origin: 50px 50px;
      animation: rotate 20s linear infinite;
    }
    .spin-reverse {
      transform-origin: 50px 50px;
      animation: rotate-back 25s linear infinite;
    }

    /* Synapse Pulse Breathing */
    .synapse-pulse {
      animation: pulse 3s ease-in-out infinite alternate;
    }

    /* Firing Brain Signals Around Frame */
    .signal-fire {
      stroke-dasharray: 8 40;
      animation: dash 3s linear infinite;
    }
    .signal-fire-delayed {
      stroke-dasharray: 6 35;
      animation: dash-back 4s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate-back {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes dash {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dash-back {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 41; }
    }
  </style>

  <!-- Main Ring Wrapper -->
  <g filter="url(#psiGlow)">
    
    <!-- Outer Framing Ring (Preserves 100% Center Space for PFP) -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="url(#psiGrad)" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="50" cy="50" r="46" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-dasharray="1 4" stroke-opacity="0.6" />

    <!-- Signal Pulse Animations traveling around the border -->
    <circle cx="50" cy="50" r="44" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" class="signal-fire" />
    <circle cx="50" cy="50" r="46" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round" class="signal-fire-delayed" />

    <!-- TOP EMBLEM: Direct Greek PSI Symbol (Ψ) for Psychology -->
    <g transform="translate(50, 6)" class="synapse-pulse" style="transform-origin: 50px 6px;">
      <!-- Subtle Emblem Glow Base -->
      <circle cx="0" cy="0" r="5" fill="#0f172a" stroke="url(#psiGrad)" stroke-width="0.8" />
      <!-- Universal Psi Symbol Path -->
      <path d="M -2.2,-2.5 L -2.2,-0.5 C -2.2,1.8 2.2,1.8 2.2,-0.5 L 2.2,-2.5 M 0,-3.2 L 0,3.2 M -1.8,3.2 L 1.8,3.2" 
            fill="none" stroke="#f43f5e" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- RIGHT SIDE: Dual Silhouette Heads (Social Interaction & Human Behavior) -->
    <g class="spin-slow">
      <!-- Profile Facing Left -->
      <path d="M 94,46 C 92,46 91,48 91,50 C 91,51 92,52 91.5,53 C 91,54 89.5,54.5 90,56" 
            fill="none" stroke="url(#splitGrad)" stroke-width="1.2" stroke-linecap="round" />
      <!-- Profile Facing Right -->
      <path d="M 6,46 C 8,46 9,48 9,50 C 9,51 8,52 8.5,53 C 9,54 10.5,54.5 10,56" 
            fill="none" stroke="url(#splitGrad)" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- BOTTOM EMBLEM: Neural Brain Synapse Arc (Cognition & Logic) -->
    <g transform="translate(50, 94)" class="synapse-pulse" style="transform-origin: 50px 94px;">
      <circle cx="0" cy="0" r="5" fill="#0f172a" stroke="#06b6d4" stroke-width="0.8" />
      <!-- Synapse Network Nodes -->
      <path d="M -2.5,0 L 0,-2 L 2.5,0 M 0,-2 L 0,2.5" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-linecap="round" />
      <circle cx="-2.5" cy="0" r="0.7" fill="#c084fc" />
      <circle cx="2.5" cy="0" r="0.7" fill="#c084fc" />
      <circle cx="0" cy="-2" r="0.8" fill="#38bdf8" />
      <circle cx="0" cy="2.5" r="0.7" fill="#38bdf8" />
    </g>

    <!-- LEFT & RIGHT ACCENT NODES (Emotions / Thought Pathways) -->
    <g class="spin-reverse">
      <!-- Neural Nodes at 9 o'clock & 3 o'clock -->
      <circle cx="5" cy="50" r="1.5" fill="#ec4899" />
      <circle cx="95" cy="50" r="1.5" fill="#3b82f6" />
    </g>

  </g>
</svg>
