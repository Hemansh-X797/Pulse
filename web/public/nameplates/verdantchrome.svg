<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120">
  <!--
    "Verdant Chrome" — brushed steel plating in black/silver with live
    emerald circuit-lines running underneath, and a slow diagonal sheen
    sweep across the whole plate. Built to the same 340x120 nameplate
    convention as aurora.svg/galaxy.svg (this renders as a full-card
    backdrop via ProfileDecorBackground.tsx, not a thin strip), with the
    animation technique from the avatar-decoration pieces like psion.svg
    (plain CSS keyframes in a <style> block, no SMIL) so it behaves
    identically across browsers to the rest of the catalog.
  -->
  <defs>
    <clipPath id="vcBounds">
      <rect x="0" y="0" width="340" height="120" rx="2" />
    </clipPath>

    <!-- Base plate: near-black with a faint cool-steel lift toward the
         center, so the panel doesn't read as flat void. -->
    <radialGradient id="vcBase" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1b1f1c" />
      <stop offset="55%" stop-color="#101312" />
      <stop offset="100%" stop-color="#050605" />
    </radialGradient>

    <!-- Brushed-metal plate segments — each plate gets a slightly
         different silver gradient so adjoining panels read as distinct
         pieces of metal, not one flat rectangle. -->
    <linearGradient id="vcPlateA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3f3c" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#8f9a95" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#20241f" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="vcPlateB" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c302d" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#a9b8b0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#161917" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="vcPlateC" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232724" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#7d8c85" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0c0e0c" stop-opacity="0.95" />
    </linearGradient>

    <!-- The moving sheen — a narrow bright silver band on a transparent
         field, swept across the whole plate on a loop via CSS transform
         rather than animating x/width directly (transforms are what the
         GPU compositor can move for free; animating raw geometry
         attributes at this width would be far more likely to visibly
         stutter on lower-end hardware). -->
    <linearGradient id="vcSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#e9fff2" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Emerald glow used for the circuit lines and node cores. -->
    <linearGradient id="vcCircuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0fe07a" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#3dffb0" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0fe07a" stop-opacity="0.15" />
    </linearGradient>
    <radialGradient id="vcNodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7bffc9" stop-opacity="1" />
      <stop offset="45%" stop-color="#2be89a" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0fe07a" stop-opacity="0" />
    </radialGradient>

    <filter id="vcGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Sheen sweep — one full pass every 5.5s, a pause at each end so it
       reads as a deliberate glint rather than a nervous constant flicker. */
    .vc-sheen {
      animation: vcSweep 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes vcSweep {
      0% { transform: translateX(-160px); }
      35% { transform: translateX(360px); }
      100% { transform: translateX(360px); }
    }

    /* Circuit energy flow — dash pattern scrolling along each path,
       like current running through a trace. Three slightly different
       durations so the branches don't all pulse in lockstep. */
    .vc-trace-1 { stroke-dasharray: 6 10; animation: vcFlow 2.2s linear infinite; }
    .vc-trace-2 { stroke-dasharray: 4 9; animation: vcFlow 2.8s linear infinite reverse; }
    .vc-trace-3 { stroke-dasharray: 5 12; animation: vcFlow 3.4s linear infinite; }
    @keyframes vcFlow {
      to { stroke-dashoffset: -32; }
    }

    /* Node pulse — the junction points along the circuitry breathing
       in and out, staggered so the whole plate never goes fully dark
       or fully bright at once. */
    .vc-node { animation: vcPulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .vc-node.d1 { animation-delay: 0.4s; }
    .vc-node.d2 { animation-delay: 0.9s; }
    .vc-node.d3 { animation-delay: 1.3s; }
    .vc-node.d4 { animation-delay: 1.8s; }
    .vc-node.d5 { animation-delay: 2.2s; }
    @keyframes vcPulse {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    /* Faint overall breathing on the whole circuit layer, so even the
       parts between nodes feel alive rather than static line art. */
    .vc-circuit-layer {
      animation: vcBreathe 4.5s ease-in-out infinite alternate;
    }
    @keyframes vcBreathe {
      0% { opacity: 0.75; }
      100% { opacity: 1; }
    }
  </style>

  <g clip-path="url(#vcBounds)">
    <!-- Base panel -->
    <rect x="0" y="0" width="340" height="120" fill="url(#vcBase)" />

    <!-- Brushed-plate segmentation: three overlapping diagonal panels
         with thin dark seams between them, like welded steel sections. -->
    <polygon points="0,0 140,0 90,120 0,120" fill="url(#vcPlateA)" />
    <polygon points="150,0 260,0 220,120 100,120" fill="url(#vcPlateB)" />
    <polygon points="270,0 340,0 340,120 230,120" fill="url(#vcPlateC)" />
    <line x1="145" y1="-4" x2="95" y2="124" stroke="#000000" stroke-opacity="0.55" stroke-width="1.5" />
    <line x1="265" y1="-4" x2="225" y2="124" stroke="#000000" stroke-opacity="0.55" stroke-width="1.5" />

    <!-- Fine brushed-metal texture: short near-horizontal hairlines,
         varied opacity, to avoid the plates reading as a flat gradient
         fill with no material grain. -->
    <g stroke="#c7d4ce" stroke-opacity="0.06" stroke-width="0.6">
      <line x1="4" y1="10" x2="130" y2="8" />
      <line x1="8" y1="18" x2="136" y2="17" />
      <line x1="2" y1="27" x2="120" y2="29" />
      <line x1="10" y1="40" x2="118" y2="38" />
      <line x1="6" y1="55" x2="104" y2="57" />
      <line x1="4" y1="70" x2="96" y2="69" />
      <line x1="8" y1="85" x2="88" y2="87" />
      <line x1="6" y1="100" x2="78" y2="98" />
      <line x1="155" y1="9" x2="250" y2="10" />
      <line x1="150" y1="24" x2="244" y2="22" />
      <line x1="152" y1="42" x2="228" y2="44" />
      <line x1="148" y1="60" x2="216" y2="58" />
      <line x1="154" y1="78" x2="204" y2="80" />
      <line x1="150" y1="96" x2="192" y2="94" />
      <line x1="278" y1="9" x2="335" y2="10" />
      <line x1="274" y1="26" x2="335" y2="25" />
      <line x1="270" y1="46" x2="335" y2="47" />
      <line x1="266" y1="66" x2="335" y2="65" />
      <line x1="262" y1="86" x2="335" y2="87" />
      <line x1="258" y1="104" x2="335" y2="103" />
    </g>

    <!-- Emerald circuitry — three branching traces running the width of
         the plate, meeting at junction nodes. Deliberately routed to
         avoid the panel's dead center, since this whole thing sits
         behind a profile card's actual content (avatar, name, bio). -->
    <g class="vc-circuit-layer" filter="url(#vcGlow)">
      <path
        class="vc-trace-1"
        d="M -10,95 L 40,95 L 58,78 L 100,78 L 118,60 L 168,60 L 186,42 L 236,42 L 254,60 L 300,60 L 316,44 L 350,44"
        fill="none" stroke="url(#vcCircuit)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
      />
      <path
        class="vc-trace-2"
        d="M -10,20 L 34,20 L 50,36 L 92,36 L 108,52 L 150,52 L 166,68 L 210,68 L 226,52 L 270,52 L 286,36 L 350,36"
        fill="none" stroke="url(#vcCircuit)" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"
      />
      <path
        class="vc-trace-3"
        d="M -10,64 L 20,64 L 36,80 L 70,80 L 86,64 L 130,64 L 146,48 L 190,48 L 206,64 L 250,64 L 266,80 L 320,80 L 336,64 L 350,64"
        fill="none" stroke="url(#vcCircuit)" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"
      />

      <!-- Junction nodes — bright cores where traces bend, each with a
           soft glow halo pulsing on its own offset. -->
      <g>
        <circle class="vc-node d1" cx="58" cy="78" r="3.2" fill="url(#vcNodeGlow)" />
        <circle cx="58" cy="78" r="1.1" fill="#eafff5" />
      </g>
      <g>
        <circle class="vc-node d2" cx="186" cy="42" r="3.6" fill="url(#vcNodeGlow)" />
        <circle cx="186" cy="42" r="1.3" fill="#eafff5" />
      </g>
      <g>
        <circle class="vc-node d3" cx="108" cy="52" r="2.8" fill="url(#vcNodeGlow)" />
        <circle cx="108" cy="52" r="1" fill="#eafff5" />
      </g>
      <g>
        <circle class="vc-node d4" cx="226" cy="52" r="3" fill="url(#vcNodeGlow)" />
        <circle cx="226" cy="52" r="1.1" fill="#eafff5" />
      </g>
      <g>
        <circle class="vc-node d5" cx="266" cy="80" r="3.4" fill="url(#vcNodeGlow)" />
        <circle cx="266" cy="80" r="1.2" fill="#eafff5" />
      </g>
      <g>
        <circle class="vc-node d1" cx="150" cy="52" r="2.4" fill="url(#vcNodeGlow)" />
        <circle cx="150" cy="52" r="0.9" fill="#eafff5" />
      </g>
      <g>
        <circle class="vc-node d3" cx="36" cy="80" r="2.6" fill="url(#vcNodeGlow)" />
        <circle cx="36" cy="80" r="0.9" fill="#eafff5" />
      </g>
    </g>

    <!-- Rivets — small silver studs along the plate seams, a plain
         material detail rather than anything animated. -->
    <g fill="#d7e0db" fill-opacity="0.5">
      <circle cx="145" cy="14" r="1.3" />
      <circle cx="120" cy="60" r="1.3" />
      <circle cx="97" cy="106" r="1.3" />
      <circle cx="265" cy="14" r="1.3" />
      <circle cx="245" cy="60" r="1.3" />
      <circle cx="227" cy="106" r="1.3" />
    </g>
    <g fill="#000000" fill-opacity="0.4">
      <circle cx="145" cy="14" r="0.5" />
      <circle cx="120" cy="60" r="0.5" />
      <circle cx="97" cy="106" r="0.5" />
      <circle cx="265" cy="14" r="0.5" />
      <circle cx="245" cy="60" r="0.5" />
      <circle cx="227" cy="106" r="0.5" />
    </g>

    <!-- Moving sheen band, drawn last so it glints over everything
         beneath it as it sweeps. -->
    <rect class="vc-sheen" x="-160" y="0" width="90" height="120" fill="url(#vcSheen)" transform="skewX(-18)" />

    <!-- Edge vignette — keeps the outermost few pixels a touch darker
         so the plate reads as inset into the card rather than floating
         flat on top of it. -->
    <rect x="0" y="0" width="340" height="120" fill="none" stroke="#000000" stroke-opacity="0.5" stroke-width="3" />
  </g>
</svg>
